  <g id="text_22">
   <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #19324b" x="15.84" y="29.595937" transform="rotate(-0 15.84 29.595937)">07  |  Confidence shifts and accuracy are not the same metric</text>
  </g>
  <g id="text_23">
   <text style="font-size: 10.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #657383" x="15.84" y="43.7472" transform="rotate(-0 15.84 43.7472)">Six HANS groups · each marker aggregates three model seeds · marker area shows binary prediction flips</text>
  </g>
  <g id="text_24">
   <text style="font-size: 9.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #19324b" x="56.88" y="501.2064" transform="rotate(-0 56.88 501.2064)">Interpretation: on non-entailment examples, an upward shift in P(entailment) is generally an errorward shift.</text>
  </g>
  <g id="text_25">
   <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #657383" x="15.84" y="533.565937" transform="rotate(-0 15.84 533.565937)">Each point is a subgroup mean across only three training seeds. Circle sizes encode change frequency, not effect significance.</text>
  </g>
